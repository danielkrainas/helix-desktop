[package]
name = "helix-comp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Helix compositor: window management, DisplayConfig and IdleMonitor"

[dependencies]
zbus.workspace = true
tokio.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
helix-session.workspace = true
smithay.workspace = true
smithay-drm-extras.workspace = true
helix-protocols = { workspace = true, features = ["server"] }
libc.workspace = true
serde.workspace = true
helix-settings.workspace = true
helix-i18n.workspace = true
helix-draw.workspace = true
reis.workspace = true
enumflags2.workspace = true
gio.workspace = true
toml.workspace = true
png.workspace = true
input-sys.workspace = true
pipewire.workspace = true
xcursor.workspace = true
# The XKB extension (X11 bells), on Smithay's x11rb.
x11rb = { version = "0.13", default-features = false, features = ["xkb"] }
# Per-client output buffer sizes (an API gate only: the Rust backend has
# it whatever libwayland is installed).
wayland-server = { version = "0.31", features = ["libwayland_1_23"] }

[[bin]]
name = "helix-comp"
path = "src/main.rs"

# Run as root through pkexec: the login screen's monitor layout
# (src/login_monitors.rs).
[[bin]]
name = "helix-login-monitors"
path = "src/bin/helix-login-monitors.rs"

[dev-dependencies]
helix-test-support.workspace = true
# gtk_shell1, client side.
helix-protocols = { workspace = true, features = ["client"] }
# A Wayland client for protocol tests.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# Checking the polkit policy.
roxmltree = "0.20"
