[package]
name = "helix-comp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Helix compositor: window management, DisplayConfig and IdleMonitor"

[dependencies]
zbus.workspace = true
tokio.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
helix-session.workspace = true
smithay.workspace = true
smithay-drm-extras.workspace = true
helix-protocols = { workspace = true, features = ["server"] }
libc.workspace = true
serde.workspace = true
helix-settings.workspace = true
helix-draw.workspace = true
reis.workspace = true
enumflags2.workspace = true
gio.workspace = true
toml.workspace = true
png.workspace = true
input-sys.workspace = true
pipewire.workspace = true
xcursor.workspace = true
# The XKB extension (X11 bells), on Smithay's x11rb.
x11rb = { version = "0.13", default-features = false, features = ["xkb"] }

[[bin]]
name = "helix-comp"
path = "src/main.rs"

[dev-dependencies]
helix-test-support.workspace = true
# A Wayland client for protocol tests.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
