# Installed as /etc/greetd/helix-greeter.toml: greetd's configuration for
# the Helix greeter. The helix-greeter package points greetd.service at it
# (a drop-in), leaving greetd's own config.toml alone.
[terminal]
# The VT to run the greeter on.
vt = 7

[default_session]
command = "/usr/libexec/helix/helix-greeter-session"
user = "_greetd"
