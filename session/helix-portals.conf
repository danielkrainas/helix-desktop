# Installed as $datadir/xdg-desktop-portal/helix-portals.conf.
# Used when XDG_CURRENT_DESKTOP contains "Helix". Interfaces Helix does not
# implement yet fall back to the GTK backend if installed. GNOME's backend
# is left out: it expects GNOME Shell, and xdg-desktop-portal asks every
# listed backend for settings, so a GNOME backend that cannot start
# stalled apps for its 25-second activation timeout.
[preferred]
default=helix;gtk;
