# nfpm (https://nfpm.goreleaser.com) package description for .deb, .rpm
# and Arch Linux packages. The release workflow
# (.github/workflows/release.yml) stages the files with packaging/stage.sh
# into ./stage and fills in @VERSION@ and @ARCH@ (amd64 or arm64; nfpm
# names them as each format expects).
name: helix-desktop
version: "@VERSION@"
arch: "@ARCH@"
platform: linux
release: "1"
section: x11
priority: optional
maintainer: Daniel Krainas
vendor: Helix
homepage: https://github.com/danielkrainas/helix-desktop
license: CC0-1.0
description: |-
  Helix desktop session
  A Wayland desktop written in Rust that is compatible with GNOME 51:
  compositor, shell, session launcher and xdg-desktop-portal backends.

# Files only, not a tree: the packages must not own shared directories
# such as /usr/bin (on Fedora the filesystem package owns them, with other
# modes, and the RPM would conflict with it).
contents:
  - src: ./stage/usr/bin/helix-comp
    dst: /usr/bin/helix-comp
  - src: ./stage/usr/bin/helix-shell
    dst: /usr/bin/helix-shell
  - src: ./stage/usr/bin/helix-session
    dst: /usr/bin/helix-session
  - src: ./stage/usr/bin/helix-portals
    dst: /usr/bin/helix-portals
  - src: ./stage/usr/bin/helix-bluetooth-sendto
    dst: /usr/bin/helix-bluetooth-sendto
  - src: ./stage/usr/share/wayland-sessions/helix.desktop
    dst: /usr/share/wayland-sessions/helix.desktop
  - src: ./stage/usr/share/xdg-desktop-portal/portals/helix.portal
    dst: /usr/share/xdg-desktop-portal/portals/helix.portal
  - src: ./stage/usr/share/xdg-desktop-portal/helix-portals.conf
    dst: /usr/share/xdg-desktop-portal/helix-portals.conf
  - src: ./stage/usr/share/doc/helix-desktop/README.md
    dst: /usr/share/doc/helix-desktop/README.md
  - src: ./stage/usr/share/licenses/helix-desktop/LICENSE
    dst: /usr/share/licenses/helix-desktop/LICENSE
  - src: ./stage/etc/xdg/helix/session.toml
    dst: /etc/xdg/helix/session.toml
    type: config|noreplace
  - src: ./stage/etc/pam.d/helix
    dst: /etc/pam.d/helix
    type: config|noreplace

overrides:
  deb:
    # Ubuntu 24.04 / Debian 13 names; the t64 ones fall back to the older
    # names.
    depends:
      - libc6
      - libgcc-s1
      - libglib2.0-0t64 | libglib2.0-0
      - libxkbcommon0
      - libinput10
      - libseat1
      - libudev1
      - libgbm1
      - libdrm2
      - libegl1
      - libpipewire-0.3-0t64 | libpipewire-0.3-0
      - libpam0g
      - dbus
    recommends:
      - xwayland
      - xdg-desktop-portal
      - gsettings-desktop-schemas
      - dconf-service
      - pipewire
  rpm:
    depends:
      - glibc
      - libgcc
      - glib2
      - libxkbcommon
      - libinput
      - libseat
      - systemd-libs
      - mesa-libgbm
      - libdrm
      - libglvnd-egl
      - pipewire-libs
      - pam
      - dbus
    recommends:
      - xorg-x11-server-Xwayland
      - xdg-desktop-portal
      - gsettings-desktop-schemas
      - dconf
      - pipewire
  archlinux:
    depends:
      - glibc
      - gcc-libs
      - glib2
      - libxkbcommon
      - libinput
      - seatd
      - systemd-libs
      - mesa
      - libdrm
      - libglvnd
      - libpipewire
      - pam
      - dbus
    recommends:
      - xorg-xwayland
      - xdg-desktop-portal
      - gsettings-desktop-schemas
      - dconf
      - pipewire
archlinux:
  packager: Helix release workflow
