# nfpm (https://nfpm.goreleaser.com) package description for .deb, .rpm
# and Arch Linux packages. The release workflow
# (.github/workflows/release.yml) stages the files with packaging/stage.sh
# into ./stage and fills in @VERSION@ and @ARCH@ (amd64 or arm64; nfpm
# names them as each format expects).
name: helix-desktop
version: "@VERSION@"
arch: "@ARCH@"
platform: linux
release: "1"
section: x11
priority: optional
maintainer: Daniel Krainas
vendor: Helix
homepage: https://helixdesktop.org
license: CC0-1.0
description: |-
  Helix desktop session
  A Wayland desktop written in Rust that is compatible with GNOME 51:
  compositor, shell, session launcher and xdg-desktop-portal backends.

# Files only, not a tree: the packages must not own shared directories
# such as /usr/bin (on Fedora the filesystem package owns them, with other
# modes, and the RPM would conflict with it).
contents:
  - src: ./stage/usr/bin/helix-comp
    dst: /usr/bin/helix-comp
  - src: ./stage/usr/bin/helix-shell
    dst: /usr/bin/helix-shell
  - src: ./stage/usr/bin/helix-session
    dst: /usr/bin/helix-session
  - src: ./stage/usr/bin/helix-portals
    dst: /usr/bin/helix-portals
  - src: ./stage/usr/bin/helix-bluetooth-sendto
    dst: /usr/bin/helix-bluetooth-sendto
  - src: ./stage/usr/bin/helix-extensions
    dst: /usr/bin/helix-extensions
  # helix-agent (Agent Access), its man page and completions.
  - src: ./stage/usr/bin/helix-agent
    dst: /usr/bin/helix-agent
  - src: ./stage/usr/share/man/man1/helix-agent.1.gz
    dst: /usr/share/man/man1/helix-agent.1.gz
  - src: ./stage/usr/share/bash-completion/completions/helix-agent
    dst: /usr/share/bash-completion/completions/helix-agent
  - src: ./stage/usr/share/fish/vendor_completions.d/helix-agent.fish
    dst: /usr/share/fish/vendor_completions.d/helix-agent.fish
  - src: ./stage/usr/share/zsh/vendor-completions/_helix-agent
    dst: /usr/share/zsh/vendor-completions/_helix-agent
    packager: deb
  - src: ./stage/usr/share/zsh/vendor-completions/_helix-agent
    dst: /usr/share/zsh/site-functions/_helix-agent
    packager: rpm
  - src: ./stage/usr/share/zsh/vendor-completions/_helix-agent
    dst: /usr/share/zsh/site-functions/_helix-agent
    packager: archlinux
  - src: ./stage/usr/libexec/helix/helix-extension-sandbox
    dst: /usr/libexec/helix/helix-extension-sandbox
  # The login screen's monitor layout (run through pkexec) and its polkit
  # action.
  - src: ./stage/usr/libexec/helix/helix-login-monitors
    dst: /usr/libexec/helix/helix-login-monitors
  - src: ./stage/usr/share/polkit-1/actions/org.helixdesktop.login-screen-monitors.policy
    dst: /usr/share/polkit-1/actions/org.helixdesktop.login-screen-monitors.policy
  - src: ./stage/usr/share/icons/hicolor/scalable/apps/org.helixdesktop.Helix.svg
    dst: /usr/share/icons/hicolor/scalable/apps/org.helixdesktop.Helix.svg
  # AppArmor (Debian/Ubuntu, Arch): lets extension sandboxes start where
  # unprivileged user namespaces are restricted. Fedora has no AppArmor.
  - src: ./stage/etc/apparmor.d/helix-extension-sandbox
    dst: /etc/apparmor.d/helix-extension-sandbox
    type: config|noreplace
    packager: deb
  - src: ./stage/etc/apparmor.d/helix-extension-sandbox
    dst: /etc/apparmor.d/helix-extension-sandbox
    type: config|noreplace
    packager: archlinux
  - src: ./stage/usr/share/wayland-sessions/helix.desktop
    dst: /usr/share/wayland-sessions/helix.desktop
  - src: ./stage/usr/share/xdg-desktop-portal/portals/helix.portal
    dst: /usr/share/xdg-desktop-portal/portals/helix.portal
  - src: ./stage/usr/share/xdg-desktop-portal/helix-portals.conf
    dst: /usr/share/xdg-desktop-portal/helix-portals.conf
  - src: ./stage/usr/lib/systemd/user/helix-session.target
    dst: /usr/lib/systemd/user/helix-session.target
  # systemd-oomd spares these (session/systemd/oomd-avoid.units).
  - src: ./stage/usr/lib/systemd/user/dbus.service.d/50-helix-oomd-avoid.conf
    dst: /usr/lib/systemd/user/dbus.service.d/50-helix-oomd-avoid.conf
  - src: ./stage/usr/lib/systemd/user/dbus-broker.service.d/50-helix-oomd-avoid.conf
    dst: /usr/lib/systemd/user/dbus-broker.service.d/50-helix-oomd-avoid.conf
  - src: ./stage/usr/lib/systemd/user/at-spi-dbus-bus.service.d/50-helix-oomd-avoid.conf
    dst: /usr/lib/systemd/user/at-spi-dbus-bus.service.d/50-helix-oomd-avoid.conf
  - src: ./stage/usr/lib/systemd/user/xdg-desktop-portal.service.d/50-helix-oomd-avoid.conf
    dst: /usr/lib/systemd/user/xdg-desktop-portal.service.d/50-helix-oomd-avoid.conf
  - src: ./stage/usr/lib/systemd/user/xdg-document-portal.service.d/50-helix-oomd-avoid.conf
    dst: /usr/lib/systemd/user/xdg-document-portal.service.d/50-helix-oomd-avoid.conf
  - src: ./stage/usr/lib/systemd/user/xdg-permission-store.service.d/50-helix-oomd-avoid.conf
    dst: /usr/lib/systemd/user/xdg-permission-store.service.d/50-helix-oomd-avoid.conf
  - src: ./stage/usr/share/glib-2.0/schemas/org.helixdesktop.shell.gschema.xml
    dst: /usr/share/glib-2.0/schemas/org.helixdesktop.shell.gschema.xml
  - src: ./stage/usr/share/glib-2.0/schemas/org.helixdesktop.extensions.gschema.xml
    dst: /usr/share/glib-2.0/schemas/org.helixdesktop.extensions.gschema.xml
  - src: ./stage/usr/share/glib-2.0/schemas/org.helixdesktop.agent-access.gschema.xml
    dst: /usr/share/glib-2.0/schemas/org.helixdesktop.agent-access.gschema.xml
  - src: ./stage/usr/share/doc/helix-desktop/README.md
    dst: /usr/share/doc/helix-desktop/README.md
  - src: ./stage/usr/share/licenses/helix-desktop/LICENSE
    dst: /usr/share/licenses/helix-desktop/LICENSE
  - src: ./stage/etc/xdg/helix/session.toml
    dst: /etc/xdg/helix/session.toml
    type: config|noreplace
  - src: ./stage/etc/pam.d/helix
    dst: /etc/pam.d/helix
    type: config|noreplace
  # The compiled translations (shell, portals, session and greeter), one
  # per language in po/LINGUAS, listed by packaging/nfpm-locales.sh.
  # @LOCALES@

overrides:
  deb:
    scripts:
      postinstall: ./packaging/postinstall.sh
    # Ubuntu 24.04 / Debian 13 names; the t64 ones fall back to the older
    # names.
    depends:
      - libc6
      - libgcc-s1
      - libglib2.0-0t64 | libglib2.0-0
      - libxkbcommon0
      - libinput10
      - libseat1
      - libudev1
      - libgbm1
      - libdrm2
      - libegl1
      - libpipewire-0.3-0t64 | libpipewire-0.3-0
      - libpam0g
      - dbus
      # Extension sandboxes, and their filtered session bus.
      - bubblewrap
      - xdg-dbus-proxy
    recommends:
      - xwayland
      - xdg-desktop-portal
      - gsettings-desktop-schemas
      - dconf-service
      - pipewire
      # The login screen's monitor layout (helix-login-monitors).
      - pkexec
    # Chinese, Japanese and Korean text (TRANSLATING.md, "Fonts").
    suggests:
      - fonts-noto-cjk
  rpm:
    depends:
      - glibc
      - libgcc
      - glib2
      - libxkbcommon
      - libinput
      - libseat
      - systemd-libs
      - mesa-libgbm
      - libdrm
      - libglvnd-egl
      - pipewire-libs
      - pam
      - dbus
      # Extension sandboxes, and their filtered session bus.
      - bubblewrap
      - xdg-dbus-proxy
    recommends:
      - xorg-x11-server-Xwayland
      - xdg-desktop-portal
      - gsettings-desktop-schemas
      - dconf
      - pipewire
      # The login screen's monitor layout (helix-login-monitors).
      - polkit
    # Chinese, Japanese and Korean text (TRANSLATING.md, "Fonts").
    suggests:
      - google-noto-sans-cjk-fonts
  archlinux:
    scripts:
      postinstall: ./packaging/postinstall.sh
    depends:
      - glibc
      - gcc-libs
      - glib2
      - libxkbcommon
      - libinput
      - seatd
      - systemd-libs
      - mesa
      - libdrm
      - libglvnd
      - libpipewire
      - pam
      - dbus
      # Extension sandboxes, and their filtered session bus.
      - bubblewrap
      - xdg-dbus-proxy
    recommends:
      - xorg-xwayland
      - xdg-desktop-portal
      - gsettings-desktop-schemas
      - dconf
      - pipewire
      # The login screen's monitor layout (helix-login-monitors).
      - polkit
    # Chinese, Japanese and Korean text (TRANSLATING.md, "Fonts").
    suggests:
      - noto-fonts-cjk
archlinux:
  packager: Helix release workflow
