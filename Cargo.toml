[workspace]
members = [
    "crates/helix-comp",
    "crates/helix-draw",
    "crates/helix-shell",
    "crates/helix-session",
    "crates/helix-settings",
    "crates/helix-portals",
    "crates/helix-protocols",
    "crates/helix-test-support",
    "tests/contract",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "CC0-1.0"
authors = ["Daniel Krainas"]
repository = "https://github.com/danielkrainas/helix-desktop"

[workspace.dependencies]
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "process", "io-util"] }
futures-util = { version = "0.3", default-features = false }
tracing = "0.1"
libc = "0.2"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2.12"
toml = "1"
zbus_xml = "5.2"
gio = { version = "0.22", features = ["v2_68"] }
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "xkbcommon"] }
ab_glyph = "0.2"
png = "0.17"
xcursor = "0.3"
resvg = { version = "0.45", default-features = false }
reis = { version = "0.7", features = ["calloop"] }
enumflags2 = "0.7"
# The libinput bindings smithay uses, with 1.23 for custom acceleration curves.
input-sys = { version = "1.19", features = ["libinput_1_23"] }
pipewire = { version = "0.9", features = ["v0_3_44"] }
smithay = { version = "0.7", default-features = false, features = [
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    "renderer_gl",
    "wayland_frontend",
    "desktop",
    "xwayland",
] }
smithay-drm-extras = { version = "0.1", default-features = false }
helix-settings = { path = "crates/helix-settings" }
helix-draw = { path = "crates/helix-draw" }
helix-test-support = { path = "crates/helix-test-support" }
helix-session = { path = "crates/helix-session" }
helix-portals = { path = "crates/helix-portals" }
helix-comp = { path = "crates/helix-comp" }
helix-shell = { path = "crates/helix-shell" }
helix-protocols = { path = "crates/helix-protocols" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Dependencies optimized in dev builds too: picture decoders (wallpapers,
# icons) are far too slow otherwise.
[profile.dev.package."*"]
opt-level = 2
