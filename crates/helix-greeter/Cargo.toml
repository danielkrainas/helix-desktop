[package]
name = "helix-greeter"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Helix login screen: a greetd greeter"

[dependencies]
helix-i18n.workspace = true
# The login screen on the accessibility bus.
helix-a11y.workspace = true
gio.workspace = true
zbus.workspace = true
futures-util.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
zeroize.workspace = true
toml.workspace = true
# helix-login-config: changes greeter.toml keeping its comments and layout.
toml_edit.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
libc.workspace = true
smithay-client-toolkit.workspace = true
helix-draw.workspace = true
# Account pictures.
png.workspace = true
# Helix's mark in the bottom bar.
resvg.workspace = true
zune-jpeg = "0.5"

[dev-dependencies]
helix-test-support.workspace = true
# helix-login-config's polkit policy.
roxmltree = "0.20"

[lib]
name = "helix_greeter"
path = "src/lib.rs"

[[bin]]
name = "helix-greeter"
path = "src/main.rs"

[[bin]]
name = "helix-login-config"
path = "src/bin/helix-login-config.rs"
