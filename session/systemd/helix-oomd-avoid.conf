# Installed as /usr/lib/systemd/user/<unit>.d/50-helix-oomd-avoid.conf for
# the user services a desktop session cannot lose (the session bus, the
# accessibility bus, the portals). Under memory pressure systemd-oomd then
# kills applications and builds first, instead of ending the session by
# killing its bus.
#
# ManagedOOMPreference=avoid is honoured for user units: their cgroups and
# the cgroup oomd monitors (user@UID.service) belong to the same user.
# OOMScoreAdjust=100 is the user manager's own level; user services default
# to 200, so the kernel's OOM killer also picks them last within the user.
[Service]
ManagedOOMPreference=avoid
OOMScoreAdjust=100
