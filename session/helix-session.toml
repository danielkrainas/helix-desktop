# Default Helix session. Installed as /etc/xdg/helix/session.toml; a copy in
# ~/.config/helix/session.toml takes precedence.

[session]
name = "helix"
# Start the apps in the XDG autostart directories (Orca when the screen
# reader is turned on, and so on). Leave it out of nested test sessions.
autostart = true

[environment]
# "Helix" first so xdg-desktop-portal picks helix-portals.conf; "GNOME" so
# GNOME-aware apps keep their GNOME integration.
XDG_CURRENT_DESKTOP = "Helix:GNOME"
XDG_SESSION_DESKTOP = "helix"

[power]
# Power off, restart and suspend through systemd-logind. Use "none" for a
# nested test session, so its Power Off doesn't power off your machine.
system = "logind"

[[component]]
name = "compositor"
# The compositor starts the shell itself, on a privileged connection that
# may bind global keys (helix_keybindings_v1).
command = ["helix-comp", "--shell", "helix-shell"]
required = true
# The compositor announces its socket with SessionManager.Setenv; the shell
# owns org.gnome.Shell once it is up.
wait_for_env = "WAYLAND_DISPLAY"
wait_for_name = "org.gnome.Shell"

[[component]]
name = "portals"
command = ["helix-portals"]
wait_for_name = "org.freedesktop.impl.portal.desktop.helix"
