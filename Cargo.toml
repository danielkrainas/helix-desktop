[workspace]
members = [
    "crates/helix-a11y",
    "crates/helix-agent",
    "crates/helix-comp",
    "crates/helix-draw",
    "crates/helix-extension",
    "crates/helix-greeter",
    "crates/helix-i18n",
    "crates/helix-shell",
    "crates/helix-session",
    "crates/helix-settings",
    "crates/helix-portals",
    "crates/helix-protocols",
    "crates/helix-test-support",
    "tests/contract",
]
exclude = ["vendor"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "CC0-1.0"
authors = ["Daniel Krainas"]
repository = "https://github.com/helixdesktop/desktop"

[workspace.dependencies]
zbus = { version = "5.19", default-features = false, features = ["tokio", "p2p"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "process", "io-util"] }
futures-util = { version = "0.3", default-features = false }
tracing = "0.1"
libc = "0.2"
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Wiping passwords from memory.
zeroize = "1"
ureq = "2.12"
toml = { version = "1", features = ["preserve_order"] }
toml_edit = "0.25"
zbus_xml = "5.2"
gio = { version = "0.22", features = ["v2_68"] }
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "xkbcommon"] }
ab_glyph = "0.2"
unicode-bidi = "0.3.18"
png = "0.17"
xcursor = "0.3"
resvg = { version = "0.45", default-features = false }
reis = { version = "0.7", features = ["calloop"] }
enumflags2 = "0.7"
# The libinput bindings smithay uses, with 1.23 for custom acceleration curves.
input-sys = { version = "1.19", features = ["libinput_1_23"] }
pipewire = { version = "0.9", features = ["v0_3_44"] }
smithay = { version = "0.7", default-features = false, features = [
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    "renderer_gl",
    "wayland_frontend",
    "desktop",
    "xwayland",
] }
smithay-drm-extras = { version = "0.1", default-features = false }
helix-a11y = { path = "crates/helix-a11y" }
helix-settings = { path = "crates/helix-settings" }
helix-draw = { path = "crates/helix-draw" }
helix-i18n = { path = "crates/helix-i18n" }
helix-extension = { path = "crates/helix-extension" }
helix-test-support = { path = "crates/helix-test-support" }
helix-session = { path = "crates/helix-session" }
helix-portals = { path = "crates/helix-portals" }
helix-comp = { path = "crates/helix-comp" }
helix-shell = { path = "crates/helix-shell" }
helix-protocols = { path = "crates/helix-protocols" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Dependencies optimized in dev builds too: picture decoders (wallpapers,
# icons) are far too slow otherwise.
[profile.dev.package."*"]
opt-level = 2

# AccessKit's AT-SPI adapter, patched (both MIT OR Apache-2.0; changes
# marked "Helix:"): EditableText InsertText and DeleteText, which upstream
# answers "not supported" (vendor/accesskit_unix,
# src/atspi/interfaces/editable_text.rs), and the expandable and expanded
# states, which upstream leaves out, and nodes' custom actions as AT-SPI
# actions after "click" (vendor/accesskit_atspi_common, src/node.rs).
[patch.crates-io]
accesskit_unix = { path = "vendor/accesskit_unix" }
accesskit_atspi_common = { path = "vendor/accesskit_atspi_common" }
# Smithay 0.7.0 (MIT), patched (changes marked "Helix:"): Xwayland window
# frames take the window's own depth and visual, so X11 windows with an
# alpha channel (GTK's rounded client-side decorations) keep it
# (vendor/smithay, src/xwayland/xwm/mod.rs, MapRequest); a layer surface's
# exclusive zone counts only where the protocol says (anchored to one edge,
# or one edge and both perpendicular ones; src/desktop/wayland/layer.rs).
smithay = { path = "vendor/smithay" }
# Also patched: page flips may be asynchronous (tearing, wp_tearing_control_v1),
# falling back to a vsynced flip (src/backend/drm/surface/*.rs, set_async_flip);
# a selection says which client offers it (src/wayland/selection/source.rs,
# SelectionSource::client), for Agent Access's clipboard rules.
