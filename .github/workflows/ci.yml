name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Fail instead of skipping D-Bus tests if dbus-daemon is missing.
  HELIX_REQUIRE_DBUS: "1"

jobs:
  check:
    runs-on: ubuntu-24.04
    # A hung test fails the run instead of holding it for hours (a full run takes about 8 minutes).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: helix-desktop

      # Contract tests read the living spec from a sibling checkout.
      - uses: actions/checkout@v4
        with:
          repository: helixdesktop/spec
          path: spec

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libglib2.0-dev libwayland-dev libxkbcommon-dev \
            libseat-dev libinput-dev libudev-dev libgbm-dev libdrm-dev libegl-dev \
            libpipewire-0.3-dev libspa-0.2-dev clang \
            dbus gsettings-desktop-schemas gettext

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: helix-desktop

      # po/POTFILES and the template must match the sources, and every
      # translation must compile (msgfmt --check) and keep the placeholders
      # and date fields of the original messages (TRANSLATING.md).
      - name: Check translations
        working-directory: helix-desktop
        run: |
          tools/i18n/update-pot.sh --check
          python3 tools/i18n/check-po.py

      - name: Clippy
        working-directory: helix-desktop
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        working-directory: helix-desktop
        env:
          HELIX_SPEC_DIR: ${{ github.workspace }}/spec
        run: cargo test --workspace --locked
