[workspace]
members = [
    "crates/helix-comp",
    "crates/helix-shell",
    "crates/helix-session",
    "crates/helix-settings",
    "crates/helix-portals",
    "crates/helix-test-support",
    "tests/contract",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "CC0-1.0"
authors = ["Daniel Krainas"]
repository = "https://github.com/danielkrainas/helix-desktop"

[workspace.dependencies]
zbus = { version = "5.19", default-features = false, features = ["tokio"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "signal", "sync", "time", "process", "io-util"] }
futures-util = { version = "0.3", default-features = false }
tracing = "0.1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "1"
zbus_xml = "5.2"
gio = "0.22"
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "xkbcommon"] }
ab_glyph = "0.2"
smithay = { version = "0.7", default-features = false, features = [
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    "renderer_gl",
    "wayland_frontend",
    "desktop",
] }
smithay-drm-extras = { version = "0.1", default-features = false }
helix-settings = { path = "crates/helix-settings" }
helix-test-support = { path = "crates/helix-test-support" }
helix-session = { path = "crates/helix-session" }
helix-portals = { path = "crates/helix-portals" }
helix-comp = { path = "crates/helix-comp" }
helix-shell = { path = "crates/helix-shell" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
