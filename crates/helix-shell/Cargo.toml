[package]
name = "helix-shell"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Helix shell: org.gnome.Shell and the shell UI"

[dependencies]
zbus.workspace = true
tokio.workspace = true
futures-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
smithay-client-toolkit.workspace = true
libc.workspace = true
libloading.workspace = true
helix-settings.workspace = true
ab_glyph.workspace = true
helix-draw.workspace = true
resvg.workspace = true
gio.workspace = true
png.workspace = true
serde.workspace = true
wayland-protocols-misc = { version = "0.3", features = ["client"] }
xkbcommon = { version = "0.8", default-features = false }
helix-protocols = { workspace = true, features = ["client"] }
# gcr's secret exchange (keyring prompts).
aes = "0.8"
cbc = "0.1"
hkdf = "0.12"
sha2 = "0.10"
num-bigint = "0.4"
base64 = "0.22"
getrandom = "0.3"

[features]
# DEVELOPMENT ONLY: the lock screen accepts the password "helix-test"
# instead of using PAM. Never enable for real use.
insecure-test-auth = []

[[bin]]
name = "helix-shell"
path = "src/main.rs"

[dev-dependencies]
helix-test-support.workspace = true
helix-session.workspace = true
serde.workspace = true
